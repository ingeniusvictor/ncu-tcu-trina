name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-win-x64:
    runs-on: windows-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compilar
        run: dotnet build src/Orbi.TrackerStudio/Orbi.TrackerStudio.csproj --configuration Release
      - name: Crear versión portátil para Windows x64
        run: dotnet publish src/Orbi.TrackerStudio/Orbi.TrackerStudio.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true --output release/win-x64
      - name: Adjuntar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ORBI-Tracker-Studio-win-x64
          path: release/win-x64/
          if-no-files-found: error
