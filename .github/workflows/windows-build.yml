name: Windows build & offline smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test-win-x64:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Preparar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restaurar dependencias
        run: dotnet restore tests/Orbi.TrackerStudio.Smoke/Orbi.TrackerStudio.Smoke.csproj
      - name: Compilar interfaz y comprobaciones
        run: dotnet build tests/Orbi.TrackerStudio.Smoke/Orbi.TrackerStudio.Smoke.csproj --configuration Release --no-restore
      - name: Comprobaciones del núcleo desconectado
        run: dotnet run --project tests/Orbi.TrackerStudio.Smoke/Orbi.TrackerStudio.Smoke.csproj --configuration Release --no-build
      - name: Publicar versión portátil Windows x64
        run: dotnet publish src/Orbi.TrackerStudio/Orbi.TrackerStudio.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true --output release/win-x64
      - name: Adjuntar ejecutable de la aplicación
        uses: actions/upload-artifact@v4
        with:
          name: ORBI-Tracker-Studio-win-x64
          path: release/win-x64/
          if-no-files-found: error
